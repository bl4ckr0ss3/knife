[package]
name = "knife-gui"
version = "0.1.0"
edition = "2021"
description = "Desktop reverse-engineering / vulnerability-research workbench built on the reknife engine"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# The agent pane talks to OpenRouter. rustls rather than native-tls so there is
# no OpenSSL to find at build time, and the key lives in the OS keyring rather
# than anywhere this repo can see.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }
tokio = { version = "1", features = ["macros"] }
futures-util = "0.3"
keyring = { version = "3", features = ["windows-native"] }

# Windows hands the taskbar whatever icon the window reports, and by default
# that is a 16x16 bitmap stretched to whatever the display scaling asks for.
# Setting the real ones needs the Win32 calls directly.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

# The analysis engine. Path dependency on the sibling crate at the repo root;
# reknife is unmodified and unaware of the GUI.
reknife = { path = "../.." }

[[bin]]
name = "knife-gui"
path = "src/main.rs"
