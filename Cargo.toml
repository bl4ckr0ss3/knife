[package]
# The `knife` name is taken on crates.io, so the crate publishes as `reknife`
# while the installed command stays `knife` (see [[bin]] below).
name = "reknife"
version = "1.8.2"
edition = "2021"
rust-version = "1.88"
description = "A reverse engineer's binary Swiss-army knife: parse, triage, and disassemble PE/ELF/Mach-O. Installs as `knife`."
license = "MIT"
authors = ["0xblack"]
repository = "https://github.com/bl4ckr0ss3/knife"
homepage = "https://github.com/bl4ckr0ss3/knife"
documentation = "https://docs.rs/reknife"
readme = "README.md"
keywords = ["reverse-engineering", "disassembler", "malware", "security", "pe"]
categories = ["command-line-utilities", "development-tools::debugging"]
exclude = ["assets/", ".github/", "scripts/", "*.png"]

# Core, CLI, TUI and MCP share this package; no desktop workspace members.
[workspace]
members = ["."]
default-members = ["."]
resolver = "2"

[[bin]]
name = "knife"
path = "src/main.rs"

# Dev-only demo recorder for the README animation. Gated behind `record` so a
# plain `cargo build` (and the published crate) never compiles it.
[[bin]]
name = "knife-record"
path = "src/bin/knife-record.rs"
required-features = ["record"]

[features]
record = []

# cargo-binstall: fetch prebuilt binaries from GitHub Releases instead of
# compiling. The release workflow produces archives matching this template.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/knife-{ target }.{ archive-format }"
bin-dir = "knife{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"

[dependencies]
goblin = "0.9"                 # PE / ELF / Mach-O / archive parsing, one crate
pdb = "0.8"                    # Microsoft PDB symbols; pure Rust, no C toolchain
iced-x86 = "1.21"             # x86/x64 disassembler, pure Rust
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = { version = "2", features = ["serde"] }
regex = "1"
owo-colors = "4"
anyhow = "1"
ratatui = "0.30"
cpp_demangle = "0.5.1"
msvc-demangler = "0.11.0"
rustc-demangle = "0.1.28"
yara-x = "=1.12.0"            # native Rust YARA engine; newest release supporting Rust 1.88
# YARA-X 1.12 declared these companion crates with caret requirements even
# though later releases changed their build/API contracts. Direct exact pins
# keep fresh `cargo install` resolutions on one compatible release family.
yara-x-macros = "=1.12.0"
yara-x-parser = "=1.12.0"
yara-x-proto = "=1.12.0"

# Keep useful line tables for our code without full dependency debug symbols.
[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = false

[profile.release]
opt-level = 3
lto = "thin"
strip = true
# Not `panic = "abort"`: knife parses hostile binaries, and its dependencies can
# panic on malformed input. Unwinding lets the parse boundary catch that and
# report a clean error instead of taking the whole process down.
codegen-units = 1
